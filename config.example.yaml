comfyui:
  url: "http://comfyui:8188"
  # Optional: public URL to use when get_image is asked for a direct URL.
  # Useful when ComfyUI is only reachable internally, such as behind k3s ingress.
  external_url: ""

model_search:
  # Optional: needed for gated/private HuggingFace models and higher API limits.
  # Env override: COMFYUI_HUGGINGFACE_TOKEN
  huggingface_token: ""
  # Optional: needed for CivitAI resources that require authentication.
  # Env override: COMFYUI_CIVITAI_API_KEY
  civitai_api_key: ""
  max_search_results: 10

security:
  mode: "audit"

logging:
  audit_file: "~/.comfyui-mcp/audit.log"

# Phase 6 (optional): background tasks for long-running workflows.
# Disabled by default — most useful for the HTTP/remote transport where a
# long generation can return a task handle instead of holding the request.
# Env overrides: COMFYUI_TASKS_ENABLED, COMFYUI_TASKS_BACKEND_URL
tasks:
  enabled: false
  # "memory://" (default, ephemeral, single-process) or
  # "redis://host:port/db" (persistent, horizontally scalable).
  backend_url: "memory://"
